<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/png/helloproperties_fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelloProperties | Luxury Real Estate & Exclusive Estates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Montserrat:ital,wght@0,300..900;1,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; background-color: #ffffff; } /* Prevent white flash */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .loader-logo-container {
        position: relative;
        width: 60px; /* Slightly smaller since no logo */
        height: 60px;
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
      }
      .loader-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .loader-ring {
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        border: 2px solid rgba(128, 0, 32, 0.1);
        border-top-color: #800020; /* Burgundy */
        border-radius: 50%;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader-ring::after {
        content: '';
        position: absolute;
        top: -10px;
        left: -10px;
        right: -10px;
        bottom: -10px;
        border: 2px solid rgba(0, 0, 0, 0.05);
        border-bottom-color: #000000; /* Black */
        border-radius: 50%;
        animation: spin 2s linear infinite reverse;
      }
      .loader-text {
        color: #000000; /* Black text */
        font-size: 14px;
        letter-spacing: 6px;
        text-transform: uppercase;
        font-weight: 600;
        animation: pulse 2s ease-in-out infinite;
        padding-left: 6px; /* Offset for letter-spacing centering */
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
